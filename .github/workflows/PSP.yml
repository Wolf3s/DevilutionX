---
name: PS2

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apk --no-cache add git cmake gettext


      - name: Configure CMake
        run: |
          psp-cmake -S. -Bbuild  -DCMAKE_BUILD_TYPE=Release

      - name: Build DevilutionX
        run: cmake --build build -j 2

      - name: Upload PBP Package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: devilutionx.elf
          path: ./build/EBOOT.PBP
...
